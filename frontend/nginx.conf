server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=2s ipv6=off;
  resolver_timeout 2s;
  client_max_body_size 16k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location = /health { access_log off; return 200 "ok"; }
  location = /build.json { add_header Cache-Control "no-store" always; }
  location = /index.html { add_header Cache-Control "no-cache" always; }
  location = /diagnostico.html { add_header Cache-Control "no-store" always; }
  location = /diagnostico.js { add_header Cache-Control "no-store" always; }
  location ^~ /api/friends {
    set $upstream social-service:8080;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Language "pt-BR,pt;q=0.9";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 504 = @unavailable;
    add_header Cache-Control "no-store" always;
  }
  location ^~ /api/games/fishing {
    set $upstream fishing-service:8080;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Language "pt-BR,pt;q=0.9";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 504 = @unavailable;
    add_header Cache-Control "no-store" always;
  }
  location ^~ /api/games/cooking {
    set $upstream cooking-service:8080;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Language "pt-BR,pt;q=0.9";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 504 = @unavailable;
    add_header Cache-Control "no-store" always;
  }
  location ^~ /api/games/park {
    set $upstream park-service:8080;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Language "pt-BR,pt;q=0.9";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 504 = @unavailable;
    add_header Cache-Control "no-store" always;
  }
  location /api/ {
    set $upstream account-service:8080;
    proxy_pass http://$upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Language "pt-BR,pt;q=0.9";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 8s;
    proxy_send_timeout 5s;
    proxy_intercept_errors on;
    error_page 502 504 = @unavailable;
    add_header Cache-Control "no-store" always;
  }

  location @unavailable { default_type application/problem+json; return 503 '{"status":503,"code":"UPSTREAM_UNREACHABLE","detail":"Esse pedacinho do Ninho está descansando. O restante continua disponível."}'; }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /ui/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
