name: ninho
services:
  verify:
    image: node:22-alpine
    profiles: [audit]
    networks: [edge]
    working_dir: /tests
    command: ["node", "wait-and-test.mjs"]
    volumes:
      - ./tests:/tests:ro
    environment:
      TEST_BASE_URL: http://frontend
      TEST_ORIGIN: ${NINHO_ORIGIN:-auto}
      TEST_DATABASE: PostgreSQL 17 no Docker
    depends_on:
      frontend:
        condition: service_healthy
  keys:
    image: node:22-alpine
    command: ["node", "/init-keys.mjs"]
    volumes:
      - ./infra/init-keys.mjs:/init-keys.mjs:ro
      - identity-keys:/identity
      - verification-keys:/verify
    restart: "no"
    network_mode: none
  frontend:
    networks: [edge]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${NINHO_PORT:-8080}:80"
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
  account-db:
    networks: [account-private]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ninho_account
      POSTGRES_USER: ninho
      POSTGRES_PASSWORD: ${ACCOUNT_DB_PASSWORD:-ninho-account-development}
    volumes:
      - account-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninho -d ninho_account"]
      interval: 5s
      timeout: 3s
      retries: 20
  account-service:
    networks: [edge, account-private]
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: account-service
    environment:
      JDBC_URL: jdbc:postgresql://account-db:5432/ninho_account?connectTimeout=2&socketTimeout=5
      DB_USER: ninho
      DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-ninho-account-development}
      NINHO_PUBLIC_KEY: /keys/public.pem
      NINHO_ALLOWED_ORIGIN: ${NINHO_ORIGIN:-auto}
      NINHO_SECURE_COOKIE: ${NINHO_SECURE_COOKIE:-false}
      NINHO_PRIVATE_KEY: /keys/private.pem
    volumes:
      - identity-keys:/keys:ro
    depends_on:
      keys:
        condition: service_completed_successfully
      account-db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    stop_grace_period: 20s
  social-db:
