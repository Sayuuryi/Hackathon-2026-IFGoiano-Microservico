server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.threads.max=40
server.tomcat.connection-timeout=5s
server.forward-headers-strategy=framework
spring.datasource.url=${JDBC_URL:jdbc:postgresql://localhost:5432/ninho}
spring.datasource.username=${DB_USER:ninho}
spring.datasource.password=${DB_PASSWORD:ninho-development-only}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=1000
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
ninho.public-key=${NINHO_PUBLIC_KEY:/keys/public.pem}
ninho.private-key=${NINHO_PRIVATE_KEY:/keys/private.pem}
ninho.allowed-origin=${NINHO_ALLOWED_ORIGIN:auto}
ninho.secure-cookie=${NINHO_SECURE_COOKIE:false}
logging.level.root=WARN
logging.level.com.ninho=INFO

spring.jackson.deserialization.fail-on-unknown-properties=true
